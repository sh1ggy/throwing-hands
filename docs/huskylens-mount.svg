<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">HuskyLens Pro camera mount (design doc §8.1 / D18)</text>

  <!-- Side view -->
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#555">SIDE VIEW</text>

  <!-- 2020 post -->
  <rect x="120" y="150" width="40" height="360" fill="#9aa5b1" stroke="#444" stroke-width="2"/>
  <line x1="140" y1="150" x2="140" y2="510" stroke="#444" stroke-dasharray="4 4"/>
  <text x="140" y="535" text-anchor="middle" font-size="12" fill="#333">2020 post, 350 mm</text>
  <!-- base stub -->
  <rect x="60" y="510" width="160" height="20" fill="#7d8894" stroke="#444" stroke-width="2"/>

  <!-- T-nuts -->
  <rect x="160" y="190" width="14" height="16" fill="#c0392b" stroke="#444"/>
  <rect x="160" y="240" width="14" height="16" fill="#c0392b" stroke="#444"/>
  <text x="105" y="222" text-anchor="end" font-size="12" fill="#c0392b">M5 T-nuts</text>

  <!-- tilt adapter (printed) -->
  <polygon points="174,180 174,266 250,250 250,196" fill="#f1c40f" stroke="#444" stroke-width="2"/>
  <text x="212" y="290" text-anchor="middle" font-size="12" fill="#8a6d00">printed tilt adapter</text>

  <!-- bracket + camera tilted -->
  <g transform="translate(250 223) rotate(30)">
    <rect x="0" y="-12" width="30" height="24" fill="#3498db" stroke="#444" stroke-width="2"/>
    <rect x="30" y="-45" width="22" height="90" fill="#2c7fb8" stroke="#444" stroke-width="2"/>
    <rect x="52" y="-40" width="26" height="80" fill="#222" stroke="#000" stroke-width="2" rx="4"/>
    <circle cx="65" cy="0" r="14" fill="#1b2a38" stroke="#7fb3d5" stroke-width="3"/>
    <circle cx="65" cy="0" r="5" fill="#7fb3d5"/>
    <circle cx="41" cy="-30" r="4" fill="#ddd" stroke="#444"/>
    <circle cx="41" cy="30" r="4" fill="#ddd" stroke="#444"/>
  </g>
  <text x="330" y="190" font-size="12" fill="#2c7fb8">included bracket + M3 screws</text>
  <text x="400" y="225" font-size="12" fill="#222">HuskyLens Pro</text>

  <!-- view cone -->
  <polygon points="340,285 760,470 560,520" fill="#2ecc71" fill-opacity="0.18" stroke="#27ae60" stroke-dasharray="6 4"/>
  <line x1="340" y1="285" x2="660" y2="425" stroke="#27ae60" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="560" y="400" font-size="12" fill="#1e8449" transform="rotate(24 560 400)">tilt ~30° down at play zone</text>
  <rect x="540" y="500" width="240" height="14" fill="#bbb" stroke="#444"/>
  <text x="660" y="540" text-anchor="middle" font-size="12" fill="#333">play zone, 25–35 cm from player</text>

  <!-- Assembly order -->
  <g transform="translate(560 60)">
    <rect width="320" height="170" rx="8" fill="#fff" stroke="#ccc"/>
    <text x="14" y="26" font-size="14" font-weight="bold" fill="#333">Assembly order</text>
    <text x="14" y="54" font-size="13" fill="#333">1. HuskyLens → bracket (2× M3 + nut)</text>
    <text x="14" y="80" font-size="13" fill="#333">2. Bracket → printed tilt adapter (M3)</text>
    <text x="14" y="106" font-size="13" fill="#333">3. Adapter → post via M5 T-nuts</text>
    <text x="14" y="132" font-size="13" fill="#333">4. Tilt down; keep out of hand's view cone</text>
    <text x="14" y="156" font-size="12" fill="#888">Heightening bracket optional (extra lift)</text>
  </g>
</svg>
