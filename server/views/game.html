<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPS-Bot · game</title>
<style>
/*THEME*/
/* Live game view: draws whatever machine is running (server/game_view.py). Served inline, no external files. */
html:has(body.mcp),body.mcp{height:auto}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:14px;padding:14px}
body.http .wrap{min-height:calc(100vh - 48px)}
body.http .graph svg{max-height:calc(100vh - 110px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.card .label{display:block;padding:10px 14px 0}
.graph{grid-row:span 3;display:flex;flex-direction:column}
.graph svg{display:block;width:100%;height:auto;flex:1}
.now{padding:0 14px 14px}
.now .state{font:700 26px/1.2 var(--mono);margin-top:6px;word-break:break-word}
.now .desc{color:var(--dim);font-size:13px;margin-top:4px;min-height:1em}

.say{padding:6px 14px 14px;font-size:16px;line-height:1.4;min-height:1.4em}
.say .scr{font:600 14px var(--mono);color:var(--husky);margin-top:6px}
.vars{padding:6px 14px 12px;font:13px var(--mono)}
.vars div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.vars div:last-child{border-bottom:0}

.vars span.chg{animation:chg 1.6s ease-out}
@keyframes chg{from{color:var(--claude)}to{color:var(--text)}}
.vars .hid{color:var(--dim);font-size:11px;padding-top:6px;border:0}
.log{grid-column:1/-1;max-height:220px;display:flex;flex-direction:column}
.log ol{list-style:none;margin:0;padding:6px 14px 10px;overflow:auto;font:12px/1.6 var(--mono)}
.log li{display:flex;gap:10px;white-space:nowrap}.log li time{color:var(--dim)}
.log li .k{color:var(--dim);width:58px;flex:none}.log li .v{overflow:hidden;text-overflow:ellipsis}
.log li.tr .v{color:var(--text)}.log li.out .v{color:var(--claude)}.log li.ign{opacity:.45}
.empty{padding:40px 20px;text-align:center;color:var(--dim)}
/* Landing: shown when no game is on (none yet, or the last one was stopped). Big, moving, readable across a room. */
/* Ambient backdrop on #root (it survives re-renders, so the drift never restarts) for the landing and the game. */
#root{position:relative;overflow:hidden;isolation:isolate}
#root:before{content:"";position:absolute;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(40% 35% at 30% 35%,color-mix(in srgb,var(--rock) 28%,transparent),transparent 70%),
             radial-gradient(40% 35% at 70% 40%,color-mix(in srgb,var(--scissors) 26%,transparent),transparent 70%),
             radial-gradient(45% 40% at 50% 75%,color-mix(in srgb,var(--paper) 20%,transparent),transparent 70%);
  filter:blur(30px);animation:drift 14s ease-in-out infinite alternate}
#root:after{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(60% 55% at 50% 50%,#000,transparent);mask-image:radial-gradient(60% 55% at 50% 50%,#000,transparent)}
.land{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vh,26px);padding:clamp(36px,7vh,80px) 20px;text-align:center;min-height:460px}
body.http .land{min-height:calc(100vh - 48px)}
@keyframes drift{0%{transform:rotate(0) scale(1)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(-6deg) scale(1.02)}}
.land .eyebrow{font:600 clamp(11px,1.2vw,14px) var(--mono);letter-spacing:4px;text-transform:uppercase;color:var(--dim)}
.land .eyebrow i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:10px;
  box-shadow:0 0 0 0 var(--good);animation:ping 1.8s ease-out infinite;vertical-align:1px}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.land h2{margin:0;font:800 clamp(52px,11vw,140px)/.95 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.04em;
  background:linear-gradient(100deg,var(--text) 20%,var(--claude) 40%,#ffd2b8 50%,var(--claude) 60%,var(--text) 80%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
.land .stage{position:relative;height:clamp(120px,20vh,190px);width:clamp(120px,20vh,190px);display:grid;place-items:center}
.land .stage:before{content:"";position:absolute;inset:8%;border-radius:50%;background:var(--hc,var(--claude));opacity:.28;filter:blur(28px);

.land .hand{font-size:clamp(70px,12vh,120px);line-height:1;transform-origin:50% 90%;animation:shake 1.6s cubic-bezier(.5,0,.5,1) infinite;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
/* rock… paper… scissors… SHOOT: three pumps, then the reveal holds */
@keyframes shake{0%,45%,100%{transform:translateY(0) rotate(0)}7.5%,22.5%,37.5%{transform:translateY(-26%) rotate(-10deg)}
  15%,30%{transform:translateY(0) rotate(0)}52%{transform:scale(1.18)}60%{transform:scale(1)}}
.land .pitch{font-size:clamp(17px,2.4vw,26px);color:var(--text);max-width:720px}

/* Game screen, flashier: shimmer title, glowing numbers that pop when they change, lit gestures pulse, a hot timer. */
.game h1{background:linear-gradient(100deg,var(--text) 25%,var(--claude) 45%,#ffd2b8 50%,var(--claude) 55%,var(--text) 75%);

  font-weight:800;letter-spacing:-.02em;font-size:clamp(26px,5vw,52px)}
.big{padding:14px clamp(14px,2.4vw,26px) 12px;border-radius:16px;background:color-mix(in srgb,var(--panel) 75%,transparent);

.gs span{transition:transform .2s}

.btimer .bar,.pbar .bar{background:color-mix(in srgb,var(--line) 80%,transparent)}

.err{color:var(--bad)}
svg .node rect{fill:#1b1e24;stroke:var(--line);stroke-width:1.5;transition:fill .2s,stroke .2s}
svg .node.seen rect{stroke:#3a3e47}
svg .node.final rect.outer{fill:none;stroke:var(--line)}
svg .node.on rect.inner{fill:color-mix(in srgb,var(--claude) 22%,#1b1e24);stroke:var(--claude);stroke-width:2.5}

svg .node.on text{fill:#fff}
svg .edge path{fill:none;stroke:#3a3e47;stroke-width:1.4}
svg .edge text{fill:var(--dim);font:10px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px}

svg .edge.hot text{fill:var(--claude)}
@keyframes flow{to{stroke-dashoffset:-10}}

.game{display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px 18px 34px;text-align:center}

/* Nerd toggle: off = the game alone; on = game and nerd side by side (stacked when narrow or in the chat). */
.tog{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 4px;

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}

@media(max-width:980px){.split{grid-template-columns:1fr}.split>.game{border-right:0;border-bottom:1px solid var(--line);height:auto!important}
  body.http .split .wrap{height:auto}}
body.mcp .split{grid-template-columns:1fr}body.mcp .split>.game{border-right:0;border-bottom:1px solid var(--line)}
@media(max-width:720px){.tog small{display:none}.chrome{gap:10px;padding:0 12px}.wrap{grid-template-columns:1fr}.graph{grid-row:auto}}
/* The countdown, drawn by the view on the wall clock from the machine's "countdown" event: the player's only cue. */
#cd{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:50;
  background:radial-gradient(circle at 50% 50%,rgba(8,9,12,.93),rgba(8,9,12,.98))}

<body>
<header class="chrome">
  <div class="brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v5M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V11M16 11V8a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L3.6 14a1.5 1.5 0 0 1 2.4-1.8L7 13.5"/></svg><span id="title">RPS-Bot</span></div>
  <span class="sp"></span>
  <a class="trainlink" href="/train" target="_blank" rel="noopener" title="Gesture training (opens in a new tab)">Train ↗</a>
  <button type="button" class="tog" id="nerdtog" aria-pressed="false" title="Show how it works next to the game (N)"><i></i>Nerd <small>how it works</small></button>
  <span class="pill" id="status"><span class="dot wait"></span>connecting</span>
</header>
<div id="root"><div class="empty">Connecting to the robot…</div></div>
<div id="cd"><div><div class="w"></div><div class="sub"></div><div class="dots"></div></div></div>
<script>
(() => {
const SOURCE = "__SOURCE__";            // "mcp" (MCP App in the chat) or "http" (a browser / the projector)
const FAST = 300, SLOW = 1500;
document.body.classList.add(SOURCE);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v === null || v === undefined ? "—" : typeof v === "object" ? JSON.stringify(v) : String(v);

// ---------------------------------------------------------------- data source
// MCP Apps: JSON-RPC over postMessage with the host (ui/initialize, then tools/call).
const host = (() => {
  if (SOURCE !== "mcp") return null;
  let seq = 0; const pending = new Map(); const handlers = {};
  window.addEventListener("message", e => {
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && pending.has(m.id) && ("result" in m || "error" in m)) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message || "host error")) : p.resolve(m.result);
    } else if (m.method) {
      (handlers[m.method] || (() => {}))(m.params || {});
      if (m.id != null) window.parent.postMessage({jsonrpc: "2.0", id: m.id, result: {}}, "*");  // e.g. teardown
    }
  });
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = ++seq; pending.set(id, {resolve, reject});
    window.parent.postMessage({jsonrpc: "2.0", id, method, params}, "*");
    setTimeout(() => { if (pending.delete(id)) reject(new Error(method + " timed out")); }, 8000);
  });
  const notify = (method, params) => window.parent.postMessage({jsonrpc: "2.0", method, params}, "*");
  return {request, notify, on: (m, f) => handlers[m] = f};
})();

function parseResult(r) {
  if (!r) throw new Error("empty tool result");
  if (r.isError) throw new Error((r.content && r.content[0] && r.content[0].text) || "tool error");
  const t = r.content && r.content.find(c => c.type === "text");
  if (t) { try { return JSON.parse(t.text); } catch (_) {} }
  if (r.structuredContent) return r.structuredContent.result || r.structuredContent;
  throw new Error("unreadable tool result");
}

// The key also controls the robot over the tunnel: take it out of the address bar at once (the page is often on a
// projector) and keep it for this tab only, so polling and reloads still work.
const VIEW_KEY = (() => {
  try {
    const q = new URLSearchParams(location.search);
    const k = q.get("key");
    if (!k) return sessionStorage.getItem("rpsbot_key");
    sessionStorage.setItem("rpsbot_key", k);
    q.delete("key");
    history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
    return k;
  } catch (_) {
    return new URLSearchParams(location.search).get("key");
  }
})();

async function fetchState(rev) {
  if (host) return parseResult(await host.request("tools/call", {name: "game_view_state", arguments: {rev, events: 40}}));
  const params = new URLSearchParams({events: 40});
  if (rev != null) params.set("rev", rev);
  if (VIEW_KEY) params.set("key", VIEW_KEY);
  const r = await fetch("/view/state?" + params, {cache: "no-store"});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ---------------------------------------------------------------- graph layout (top to bottom, layered from initial)
function buildGraph(def) {
  const names = Object.keys(def.states);
  const edges = new Map();               // "a>b" -> {from, to, labels:Set}
  for (const [s, st] of Object.entries(def.states)) {
    for (const [ev, hs] of Object.entries(st.on || {})) {
      for (const h of (Array.isArray(hs) ? hs : [hs])) {
        if (!h || !h.to) continue;
        const k = s + ">" + h.to;
        if (!edges.has(k)) edges.set(k, {from: s, to: h.to, labels: new Set()});
        edges.get(k).labels.add(ev.replace(/^(gesture|see):/, ""));
      }
    }
  }
  const depth = {[def.initial]: 0}; const queue = [def.initial];
  while (queue.length) {
    const s = queue.shift();
    for (const e of edges.values()) if (e.from === s && !(e.to in depth)) { depth[e.to] = depth[s] + 1; queue.push(e.to); }
  }
  let maxD = Math.max(0, ...Object.values(depth));
  for (const n of names) if (!(n in depth)) depth[n] = ++maxD;
  const layers = [];
  for (const n of names) (layers[depth[n]] = layers[depth[n]] || []).push(n);
  const pos = {};
  layers.forEach((L, d) => {                // order each layer by its parents' average x
    if (d > 0) {
      const bary = n => { const ps = [...edges.values()].filter(e => e.to === n && depth[e.from] < d).map(e => pos[e.from].i);
                          return ps.length ? ps.reduce((a, b) => a + b) / ps.length : 1e9; };
      L.sort((a, b) => bary(a) - bary(b));
    }
    L.forEach((n, i) => pos[n] = {i: i - (L.length - 1) / 2, d});
  });
  const W = 120, H = 34, GX = 26, GY = 46;
  const widest = Math.max(...layers.map(L => L.length));
  const width = Math.max(widest * (W + GX) + 120, 360);
  for (const n of names) { pos[n].x = width / 2 - 40 + pos[n].i * (W + GX); pos[n].y = 24 + pos[n].d * (H + GY); }
  return {names, edges: [...edges.values()], pos, W, H, width, height: 24 + layers.length * (H + GY) - GY + 30, final: n => !!def.states[n].final};
}

function edgePath(g, e) {
  const a = g.pos[e.from], b = g.pos[e.to], {W, H} = g;
  if (e.from === e.to) {                    // self loop on the right
    const x = a.x + W / 2, y = a.y;
    return {d: `M${x},${y - 7} C${x + 34},${y - 24} ${x + 34},${y + 24} ${x},${y + 7}`, lx: x + 30, ly: y};
  }
  if (b.d > a.d) {                          // forward: bottom to top
    const y1 = a.y + H / 2, y2 = b.y - H / 2, my = (y1 + y2) / 2;
    return {d: `M${a.x},${y1} C${a.x},${my} ${b.x},${my} ${b.x},${y2}`, lx: (a.x + b.x) / 2, ly: my};
  }
  // back or sideways: arc out to the right of both
  const x1 = a.x + W / 2, x2 = b.x + W / 2, side = Math.max(x1, x2) + 30 + Math.abs(a.d - b.d) * 8;
  return {d: `M${x1},${a.y} C${side},${a.y} ${side},${b.y} ${x2},${b.y}`, lx: side - 8, ly: (a.y + b.y) / 2};
}

function drawGraph(g, snap) {
  const seen = new Set((snap.transitions || []).flatMap(t => [t.from, t.to]));
  const last = (snap.transitions || []).slice(-1)[0];
  const hot = last && last.from && snap.status === "running" ? last.from + ">" + last.to : null;
  const label = e => { const l = [...e.labels]; return l.length > 2 ? l.slice(0, 2).join(", ") + ` +${l.length - 2}` : l.join(", "); };
  const short = n => n.length > 15 ? n.slice(0, 14) + "…" : n;
  const edges = g.edges.map(e => { const p = edgePath(g, e), k = e.from + ">" + e.to;
    return `<g class="edge${k === hot ? " hot" : ""}"><path d="${p.d}" marker-end="url(#ah${k === hot ? "h" : ""})"/>` +
           `<text x="${p.lx}" y="${p.ly}">${esc(label(e))}</text></g>`; }).join("");
  const nodes = g.names.map(n => { const p = g.pos[n], x = p.x - g.W / 2, y = p.y - g.H / 2;
    const cls = ["node", n === snap.state ? "on" : "", seen.has(n) ? "seen" : "", g.final(n) ? "final" : ""].join(" ");
    return `<g class="${cls}"><title>${esc(n)}</title>` +
           (g.final(n) ? `<rect class="outer" x="${x - 4}" y="${y - 4}" width="${g.W + 8}" height="${g.H + 8}" rx="11"/>` : "") +
           `<rect class="inner" x="${x}" y="${y}" width="${g.W}" height="${g.H}" rx="8"/><text x="${p.x}" y="${p.y}">${esc(short(n))}</text></g>`; }).join("");
  const marker = (id, c) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`;
  return `<svg viewBox="0 0 ${g.width} ${g.height}" preserveAspectRatio="xMidYMin meet"><defs>${marker("ah", "#3a3e47")}${marker("ahh", "var(--claude)")}</defs>${edges}${nodes}</svg>`;
}

// ---------------------------------------------------------------- render
let rev = null, def = null, graph = null, snap = null, recvAt = 0, prevVars = {}, lastKey = null;

function logRows(s) {
  const rows = [];
  for (const t of s.transitions || []) rows.push({t: t.t, cls: "tr", k: "go", v: `${t.from || "·"} → ${t.to}  (${t.event})`});
  for (const e of s.events || []) {
    if (e.output) {
      const what = e.text != null ? e.text : Object.entries(e).filter(([k]) => !["t", "event", "output", "state"].includes(k)).map(([k, v]) => `${k}=${fmt(v)}`).join(" ");
      rows.push({t: e.t, cls: "out", k: e.event, v: what});
    } else if (e.event !== "enter") {
      const g = e.event.startsWith("gesture:") ? e.event.slice(8) : e.event.startsWith("see:") ? e.event.slice(4) : null;
      rows.push({t: e.t, cls: e.handled ? "" : "ign", k: g ? "sees" : e.event,
                 v: (g ? `<span class="g-${esc(g)}">${esc(g)}</span>` : esc(e.event)) + (e.payload != null ? " " + esc(fmt(e.payload)) : "") + (e.handled ? "" : "  (no handler)"), html: true});
    }
  }
  rows.sort((a, b) => b.t - a.t);
  return rows.slice(0, 40).map(r => `<li class="${r.cls}"><time>${new Date(r.t * 1000).toTimeString().slice(0, 8)}</time>` +
    `<span class="k">${esc(r.k)}</span><span class="v">${r.html ? r.v : esc(r.v)}</span></li>`).join("");
}

// Nerd is a toggle, not a tab: on, the state graph sits beside the game so both are on screen at once. #nerd in the
// address opens it on; N toggles it (handy on the projector).
let nerd = location.hash === "#nerd";
function setNerd(on) {
  nerd = on;
  if (SOURCE === "http") history.replaceState(null, "", location.pathname + location.search + (on ? "#nerd" : ""));
  render();
}
$("#nerdtog").addEventListener("click", () => setNerd(!nerd));
document.addEventListener("keydown", e => {
  if ((e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA/.test(e.target.tagName)) setNerd(!nerd);
});

// Redraws patch, they don't replace: the layout shell is built once per mode (game / split) and each section is
// swapped only when its own HTML changed. Scroll positions, the graph and running animations survive every poll.
function patch(el, html) { if (el && el._html !== html) { el.innerHTML = html; el._html = html; } }

function shell(mode) {
  const root = $("#root");
  if (root.dataset.shell === mode) return;
  root.dataset.shell = mode;
  root.innerHTML = mode === "split" ? `<div class="split"><div class="game" id="g"></div><div class="wrap">
      <section class="card graph" id="n-graph"></section>
      <section class="card now" id="n-now"></section>
      <section class="card" id="n-robot"></section>
      <section class="card vars-c"><span class="label">Vars</span><div class="vars" id="n-vars"></div></section>
      <section class="card log"><span class="label">Events</span><ol id="n-log"></ol></section></div></div>`
    : `<div class="game" id="g"></div>`;
}

function render() {
  const s = snap;
  $("#nerdtog").setAttribute("aria-pressed", String(nerd));
  $("#title").textContent = s && s.machine ? "RPS-Bot · " + s.machine : "RPS-Bot";
  if (!s || !s.machine || !def || s.status === "stopped" || s.status === "idle") {
    $("#root").dataset.shell = "land"; renderLanding(s); return;
  }
  landKey = null;
  const changed = new Set(Object.keys(s.vars || {}).filter(k => k in prevVars && JSON.stringify(prevVars[k]) !== JSON.stringify(s.vars[k])));
  prevVars = s.vars || {};
  shell(nerd ? "split" : "game");
  patch($("#g"), renderGame(s));
  if (nerd) for (const [id, html] of Object.entries(renderNerd(s, changed))) patch($("#n-" + id), html);
  tick();
}

// ---------------------------------------------------------------- landing (no game on)
// The hand pumps three times and reveals one of the gestures the camera knows now, so after Claude teaches it a new
// game the landing shows the new gestures without a code change.
const HAND = {rock: "✊", paper: "✋", scissors: "✌️", up: "👍", thumbs_up: "👍", down: "👎", thumbs_down: "👎",
              ok: "👌", point: "👉", left: "👈", right: "👉", wave: "👋", peace: "✌️", fist: "✊", palm: "✋", one: "☝️",
              higher: "👍", lower: "👎", yes: "👍", no: "👎", rock_on: "🤘", call: "🤙", love: "🫶"};
const GCOL = {rock: "var(--rock)", paper: "var(--paper)", scissors: "var(--scissors)"};
const SPARE = ["var(--claude)", "var(--good)", "var(--warn)", "var(--scissors)", "var(--rock)", "#c084fc"];
let landKey = null;
function renderLanding(s) {
  const gs = (s && s.gesture_set) || {};
  const known = Object.entries(gs.gestures || {}).sort((a, b) => a[1] - b[1]).map(([g]) => g).filter(g => g !== "nothing");
  const items = known.map((g, i) => ({g, col: GCOL[g] || SPARE[i % SPARE.length], hand: HAND[g] || "✊"}));
  const last = s && s.machine && s.status === "stopped" ? s.machine : null;
  const key = JSON.stringify([items.map(x => x.g), last]);
  if (key === landKey) return;             // already showing: don't restart the animation on every poll
  landKey = key;
  const reveal = items.length ? items : [{hand: "✊", col: "var(--rock)"}, {hand: "✋", col: "var(--paper)"}, {hand: "✌️", col: "var(--scissors)"}];
  const isRps = ["rock", "paper", "scissors"].every(g => known.includes(g));
  const ask = isRps || !known.length ? "Let’s play rock paper scissors" : `Let’s play ${pretty(last || gs.set || "a game")}`;
  $("#root").innerHTML = `<div class="land">
    <div class="eyebrow"><i></i>Online · waiting for a challenger</div>
    <h2>RPS-Bot</h2>
    <div class="stage" style="--hc:${reveal[0].col}"><div class="ring"></div><div class="hand">✊</div></div>
    <div class="pitch">${isRps || !known.length ? "Rock, paper, scissors against a robot hand. <b>Think you can beat it?</b>" : "<b>Think you can beat it?</b>"}</div>
    <div class="ask">${esc(ask)}</div>
    ${items.length ? `<div class="knows"><span class="blabel">I know</span>${items.map((x, i) =>
      `<span class="g" style="--c:${x.col};animation-delay:${0.15 + i * 0.08}s">${esc(x.hand)} ${esc(pretty(x.g))}</span>`).join("")}</div>` : ""}
    ${last ? `<div class="last">last game: ${esc(pretty(last))} · stopped</div>` : ""}
  </div>`;
  const hand = $(".land .hand"), stage = $(".land .stage");
  let n = 0;
  // swap the gesture at the pause between pumps and the reveal (45 % of the 1.6 s cycle)
  const show = () => { const x = reveal[n++ % reveal.length]; hand.textContent = x.hand; stage.style.setProperty("--hc", x.col); };
  hand.addEventListener("animationiteration", () => { hand.textContent = "✊"; setTimeout(show, 720); });
  setTimeout(show, 720);
}

const pretty = n => n.replace(/[_-]+/g, " ").replace(/^./, c => c.toUpperCase());
const timerHTML = (cls) => `<div class="tm ${cls || ""}" style="display:none"><div class="bar"><i></i></div><div class="timer"><span>timer</span><span></span></div></div>`;

function renderGame(s) {
  const named = ["good", "bad", "warn", "dim", "accent"];
  const cssColor = {good: "var(--good)", bad: "var(--bad)", warn: "var(--warn)", dim: "var(--dim)", accent: "var(--claude)"};
  const colorAttr = c => !c ? ["", ""] : named.includes(c) ? [` c-${c}`, `--c:${cssColor[c]}`] : ["", `color:${esc(c)};--c:${esc(c)}`];
  const prev = renderGame.prev || {}; const next = {};
  const block = (b, i) => {
    const [ccls, cstyle] = colorAttr(b.color);
    const cls = (extra, size) => `class="b ${extra} sz-${b.size || size}${ccls}"` + (cstyle ? ` style="${cstyle}"` : "");
    const label = b.label ? `<span class="blabel">${esc(b.label)}</span>` : "";
    switch (b.kind) {
      case "text": return `<div ${cls("text", "m")}>${esc(b.text)}</div>`;
      case "said": case "shown": { next[i] = b.text; const fresh = prev[i] !== b.text ? " new" : "";
        return `<div ${cls(b.kind + fresh, b.kind === "said" ? "m" : "l")}>${esc(b.text)}</div>`; }
      case "big": { next[i] = b.text;
        return `<div ${cls("big" + (i in prev && prev[i] !== b.text ? " chg" : ""), "m")}><b>${esc(b.text)}</b>${b.label ? `<span>${esc(b.label)}</span>` : ""}</div>`; }
      case "row": return `<div class="row">${b.items.map((x, j) => block(x, i + "." + j)).join("")}</div>`;
      case "gestures": return `<div ${cls("", "m")}>${label}<div class="gs">${b.items.map(g =>
        `<span class="${g.lit ? "lit" : ""}" style="--c:${esc(g.color)}">${esc(pretty(g.name))}</span>`).join("")}</div></div>`;
      case "timer": return `<div ${cls("", "m")}>${label}${timerHTML("btimer")}</div>`;
      case "seen": return `<div ${cls("", "s")}>${b.label ? esc(b.label) + " " : ""}<b style="color:${esc(b.gesture_color)}">${esc(pretty(b.text))}</b></div>`;
      case "bar": { const pct = b.max > 0 ? Math.max(0, Math.min(100, 100 * b.value / b.max)) : 0;
        return `<div ${cls("pbar", "s")}>${label}<div class="bar"><i style="width:${pct}%"></i></div><div class="timer" style="justify-content:center">${esc(fmt(b.value))} / ${esc(fmt(b.max))}</div></div>`; }
      case "list": return `<div ${cls("", "m")}>${label}<ol class="blist">${b.items.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
      case "error": return `<div class="b berr">⚠ ${esc(b.text)}</div>`;
      default: return "";
    }
  };
  const body = (s.screen || []).map((b, i) => block(b, String(i))).join("");
  renderGame.prev = next;
  const ended = s.status !== "running" && s.status !== "finished" ? `<div class="b sz-m c-dim">${esc(pretty(s.status))}</div>` : "";
  return `<h1>${esc((def.view || {}).title || pretty(def.name))}</h1>${body}${ended}`;
}

function renderNerd(s, changed) {
  const st = def.states[s.state] || {};
  const outs = (s.events || []).filter(e => e.output);
  const lastSay = [...outs].reverse().find(e => e.event === "speak");
  const lastShow = [...outs].reverse().find(e => e.event === "show");
  const vars = Object.entries(s.vars || {}).map(([k, v]) => `<div><b>${esc(k)}</b><span class="${changed.has(k) ? "chg" : ""}" title="${esc(fmt(v))}">${esc(fmt(v))}</span></div>`).join("") +
    (s.hidden && s.hidden.length ? `<div class="hid">+ ${s.hidden.length} hidden</div>` : "");
  return {
    graph: `<span class="label">${esc(def.name)}${def.description ? " · " + esc(def.description.slice(0, 90)) : ""}</span>${drawGraph(graph, s)}`,
    now: `<span class="label" style="padding-left:0">${esc(s.status)}${s.error ? ` · <span class="err">${esc(s.error)}</span>` : ""}</span>
      <div class="state">${esc(s.state || "—")}</div><div class="desc">${esc(st.description || "")}</div>${timerHTML()}`,
    robot: `<span class="label">Robot</span><div class="say">${lastSay ? esc(lastSay.text) : `<span style="color:var(--dim)">—</span>`}
      ${lastShow ? `<div class="scr">▣ ${esc(lastShow.text)}</div>` : ""}</div>`,
    vars: vars || `<span style="color:var(--dim)">none</span>`,
    log: logRows(s),
  };
}

function tick() {                          // the timer bars move between polls (game and nerd can both show one)
  document.querySelectorAll(".tm").forEach(tickOne);
}
function tickOne(el) {
  if (!snap) return;
  if (snap.timeout_in_s == null || snap.status !== "running") { el.style.display = "none"; return; }
  const total = (snap.in_state_s || 0) + snap.timeout_in_s;
  const left = Math.max(0, snap.timeout_in_s - (performance.now() - recvAt) / 1000);
  el.style.display = "";
  el.querySelector("i").style.width = (total > 0 ? 100 * left / total : 0) + "%";
  el.querySelector(".timer span:first-child").textContent = el.classList.contains("btimer") ? "" : "timer";
  el.querySelector(".timer span:last-child").textContent = left.toFixed(1) + " s";
}
(function frame() { tick(); countdown(); requestAnimationFrame(frame); })();

// The countdown overlay: ROCK… PAPER… SCISSORS… then SHOOT! with "hold it" while the camera reads. Timed from the
// event's wall-clock start (the server is on this laptop), so a late poll only trims the first beat.
const CD_HOLD_S = 1.2;
const CD_REVEAL_S = 3.2;                      // the reveal stays up until this long after the countdown started, minus the beats                         // SHOOT stays up this long: read_delay_s + read_window_s, plus margin
const CD_COL = ["var(--rock)", "var(--warn)", "var(--scissors)", "var(--good)"];
let cdKey = "";
function countdown() {
  const el = $("#cd");
  const outs = ((snap && (snap.status === "running" || snap.status === "finished") && snap.events) || []).filter(e => e.output);  // finished: the last round's reveal
  let i = outs.length - 1; while (i >= 0 && outs[i].event !== "countdown") i--;
  const ev = i >= 0 ? outs[i] : null;
  const after = ev ? outs.slice(i + 1).some(e => e.event === "show" || e.event === "speak") : false;  // result is in
  const period = ev ? ev.period_ms / 1000 : 0, el_s = ev ? Date.now() / 1000 - ev.at : -1;
  const end = ev ? ev.beats * period + CD_HOLD_S : 0;
  // The reveal: in software mode there's no hand, so the robot's throw has to be seen here. RPS-style games only
  // (vars rv.robot + read.move); a replay or no-read round has read.known false and shows nothing.
  const v = (snap && snap.vars) || {};
  if (ev && after && v.rv && v.rv.robot && v.read && v.read.known && el_s >= 0 && el_s < ev.beats * period + CD_REVEAL_S) {
    const oc = (v.oc && v.oc.outcome) || "";
    const key = ev.at + ":reveal";
    if (key === cdKey) return;
    cdKey = key;
    const side = (who, g, win) => `<div class="side${win ? " win" : ""}"><span class="h">${HAND[g] || "❔"}</span>${esc(who)} · ${esc(pretty(g))}</div>`;
    el.classList.add("on");
    el.style.setProperty("--cdc", oc === "human" ? "var(--good)" : oc === "robot" ? "var(--bad)" : "var(--warn)");
    el.querySelector(".w").innerHTML = `<div class="rv">${side("Robot", v.rv.robot, oc === "robot")}<span class="vs">vs</span>${side("You", v.read.move, oc === "human")}</div>`;
    el.querySelector(".w").classList.remove("go");
    el.querySelector(".sub").textContent = oc === "human" ? "You win!" : oc === "robot" ? "Robot wins" : oc === "draw" ? "Draw" : "";
    el.querySelector(".dots").innerHTML = "";
    return;
  }
  if (!ev || after || el_s < 0 || el_s > end) { if (el.classList.contains("on")) { el.classList.remove("on"); cdKey = ""; } return; }
  const k = Math.min(ev.beats, Math.floor(el_s / period));
  const shoot = k >= ev.beats;
  const words = ev.words || [];
  const word = shoot ? (words[ev.beats] || "SHOOT") + "!" : (words[k] || String(ev.beats - k)) + "…";
  const key = ev.at + ":" + k;
  if (key === cdKey) return;
  cdKey = key;
  el.classList.add("on");
  el.style.setProperty("--cdc", CD_COL[Math.min(k, CD_COL.length - 1)]);
  const w = el.querySelector(".w"); w.textContent = word; w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
  el.querySelector(".sub").textContent = shoot ? "Throw now and hold it still" : "Get your hand ready";
  el.querySelector(".dots").innerHTML = Array.from({length: ev.beats + 1}, (_, j) => `<i class="${j <= k ? "on" : ""}"></i>`).join("");
}

function setStatus(cls, text) { $("#status").innerHTML = `<span class="dot ${cls}"></span>${esc(text)}`; }

function accept(s) {
  if (s.definition) { def = s.definition; graph = buildGraph(def); rev = s.rev; }
  else if (s.rev !== rev && s.rev) { rev = null; }        // definition changed but not sent: ask again
  snap = s; recvAt = performance.now();
  setStatus(s.status === "running" ? "on" : "wait", s.status === "running" ? "live" : s.status);
  const key = JSON.stringify({...s, in_state_s: 0, timeout_in_s: 0, definition: 0, rev: rev});
  if (key !== lastKey || s.definition) { lastKey = key; render(); }   // redraw only on change; the timer ticks itself
}

let timer = null;
async function poll() {
  clearTimeout(timer);
  let wait = FAST;
  if (document.visibilityState === "hidden") wait = SLOW;
  else {
    try { const s = await fetchState(rev); accept(s); if (s.status !== "running" && host) wait = SLOW; }  // the browser view stays fast: a game's first countdown starts right after start_machine
    catch (e) { setStatus("", "offline: " + e.message); wait = SLOW; }
  }
  timer = setTimeout(poll, wait);
}

async function start() {
  if (host) {
    host.on("ui/notifications/tool-result", p => { try { accept(parseResult(p)); } catch (_) {} });
    try {
      await host.request("ui/initialize", {protocolVersion: "2026-01-26", appInfo: {name: "rps-bot-game-view", version: "1.0.0"}, appCapabilities: {}});
      host.notify("ui/notifications/initialized", {});
    } catch (e) { setStatus("", "host: " + e.message); }
    new ResizeObserver(() => host.notify("ui/notifications/size-changed", {height: Math.ceil(document.documentElement.scrollHeight)})).observe(document.body);
  }
  poll();
}
start();
})();
</script>
